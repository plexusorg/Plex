# {type} - The type of indefinite ban
# {appeal_url} - Appeal URL
# {reason} - The reason
indefBanMessageReason: "<red>Your {type} is indefinitely banned! You may appeal at <gold>{appeal_url}.\n<red>Reason: <gold>{reason}"
