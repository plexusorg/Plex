# Plex Indefinite Bans File
# Players with their UUID / IP / Usernames in here will be indefinitely banned until removed
# Use labels to organize the entries. Plex does not use these labels to decide who is banned.
# Choose any non-empty, unique label without dots (.), including numbers or names.
# Quote labels containing YAML punctuation, such as "case: repeated evasion".
# Each block can contain multiple related usernames, UUIDs, and IPs.

# If you want to get someone's UUID, use https://api.ashcon.app/mojang/v2/user/<username>
griefers:
  # The reason is optional. If set, it is shown in the HTTPD's indefinite bans page and, without a message, on the
  # ban screen.
  reason: "Repeated griefing"
  # The message is optional. If set, this MiniMessage text is the whole ban screen, in place of the indefBanMessage
  # screens in messages.yml, for example:
  # message: "<red>You are banned.\n<gray>Appeal at <gold>example.org"
  users:
    - "badplayer123"
    - "badplayer321"
  uuids:
    - 1dac0e92-f565-4479-afd5-38c7df5f9732 # badplayer123
  ips:
    - 123.123.123.123

bypassers:
  users:
    - "bypasser1"
  ips:
    - 192.0.2.1
    - 169.254.1.2
